<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Using Bulma</title>
        <link rel="stylesheet" href="index.css">
        <link rel="icon" href="./image/Bulma.png" type="image/x-icon">

    </head>
    <body class=" mx-0 mx-desktop-6" >
        <header class="header is-flex is-flex-direction-row is-justify-content-space-between mx-6 is-marginless-desktop mt-4 mb-6" >
            <figure class="image is-64x64">
                <img class="is-rounded" src="https://bulma.io/assets/images/placeholders/64x64.png" />
              </figure>
            <button class="button is-primary">Ingresar</button>
        </header>
        <h1 class="title mx-6">Escribinos</h1>
        <p class="mx-6 mb-6">Dejanos tu mensaje y te responderemos pronto</p>
        
        <form class="is-flex is-flex-direction-column is-justify-content-center mx-6    " action="">
            <label class="label" for="">Nombre</label>
            <div class="control">
                <input class="input" type="text" placeholder="liobarrozo...">
            </div>
            <label class="label mt-5" for="">Mensaje</label>
            <div class="control">
                <textarea class="textarea" placeholder="Me comunico con el fin de..."></textarea>
            </div>
            <div class="field is-grouped mt-5">
                <div class="control">
                  <button class="button is-link">Enviar</button>
                </div>
                <div class="control">
                  <button class="button is-link is-light">Cancelar</button>
                </div>
            </div>
        </form>
    </body>

</html>
